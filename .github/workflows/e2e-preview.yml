name: E2E on Preview

# Runs the Playwright smoke tests against the Vercel Preview of a pull request,
# once Vercel reports the deployment as ready. A READY deployment only proves
# the build worked; this proves the app renders.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke tests
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          # Lets the tests through Vercel Deployment Protection. Create it in
          # Vercel > Project > Settings > Deployment Protection > Protection
          # Bypass for Automation, and add it as a repository secret.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
